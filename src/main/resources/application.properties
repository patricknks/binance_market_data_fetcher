# ==== Data Fetcher service configuration (defaults, bundled in the JAR) ====
# Override at runtime with: --spring.config.location=file:./config/application.properties

spring.application.name=data-fetcher

# ---- Database ----
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/algo_trade
spring.datasource.username=postgres
# From the DB_PASSWORD environment variable; never commit the password itself.
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- Schema / table names ----
# Referenced by DatabaseService; leave app.database.schema blank to use unqualified table names.
app.database.schema=algo_oltp
app.database.table.market-data=eth_market_data_2
app.database.table.application-time=application_time_2

# ---- Warmup (historical backfill from data.binance.vision) ----
# Runs instead of the realtime loop while the table is empty or the newest row is older
# than stale-threshold-days. Warmup fills up to that cutoff; realtime covers the remainder
# via REST, which is also the only source with more than 30 days of open-interest history.
app.warmup.enabled=true
# Earliest ETHUSDT/1h spot archive on Binance Vision.
app.warmup.start-date=2017-08-01
app.warmup.stale-threshold-days=14
app.warmup.base-url=https://data.binance.vision
# Futures metrics archives (open interest, long/short) do not exist before this date, so
# those columns stay null for earlier rows. cmc_circulating_sply has no archive at all.
app.warmup.metrics-start-date=2021-12-01
# Offset between a candle's open and its metrics sample in the archives. 5 is verified for
# 1h; a wrong value shows up as null open-interest columns on warmup rows (warned in the log).
app.warmup.metrics-offset-minutes=5
app.warmup.auto-create-partition=true
app.warmup.http-timeout-seconds=120

# ---- Connection pool (HikariCP) ----
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ---- Logging ----
# NOTE: the actual log file path is defined in logback-spring.xml (${app.home}/logs/application.log);
# the properties below only take effect for levels and patterns.
logging.level.root=INFO
logging.level.com.trading=INFO
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %msg%n
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=3

# ---- Pair / market ----
# A ".P" suffix selects the USD-M perpetual for OHLCV (e.g. ETHUSDT.P); without it, spot.
# The suffix is stripped before every API call and archive path, and is stored in
# ticker_name so perp rows stay distinguishable from spot rows of the same pair.
# Open interest, long/short, funding rate and CMC supply are perpetual-only figures and
# always come from the futures endpoints, whichever market OHLCV uses.
app.binance.symbol=ETHUSDT
# Drives the API parameter AND every window, chunk and warmup step in the fetch path, so the
# timeframe is a config change. Valid for open interest / long-short: 5m, 15m, 30m, 1h, 2h,
# 4h, 6h, 12h, 1d. Use a separate set of tables per timeframe.
app.binance.interval=1h

# ---- Binance endpoints ----
# klines-url is used for spot symbols, perp-klines-url when the symbol ends with ".P".
app.binance.klines-url=https://api.binance.com/api/v3/klines
app.binance.perp-klines-url=https://fapi.binance.com/fapi/v1/klines
app.binance.oi-url=https://fapi.binance.com/futures/data/openInterestHist
app.binance.ls-url=https://fapi.binance.com/futures/data/topLongShortPositionRatio
# Funding rate is the one derivatives endpoint without the 30-day cap: it serves history all
# the way back to the perpetual's launch, so warmup reads it here rather than from the archives.
app.binance.funding-url=https://fapi.binance.com/fapi/v1/fundingRate
# Live order book, max 1000 levels per side (~+-0.45% of the price for ETHUSDT).
app.binance.depth-url=https://fapi.binance.com/fapi/v1/depth
app.binance.timeout-seconds=15

# ---- Order book depth ----
# Off here: the default tables above predate the 13 depth columns. Turn on only for a table
# created with them (see config/ddl/tables_perp_1h_new.ddl).
app.depth.enabled=false
app.depth.start-date=2023-01-01
app.depth.sync-lookback-days=30
app.depth.sync-interval-minutes=60
app.depth.sync-initial-delay-seconds=120
spring.task.scheduling.pool.size=3

# ---- Ports ----
# Listening ports -- these two MUST be unique per instance when running several
# in parallel, otherwise startup fails with "Address already in use":
#   --server.port=8090 --app.healthcheck.port=8091
server.port=8080
app.healthcheck.port=8061

# Outbound only: the scheduler connects to the indicator service as a client.
# Keep this the SAME across all instances -- it is not a port this app binds.
app.trigger.host=127.0.0.1
app.trigger.port=8070

# ---- Tuning ----
app.refresh-rate-seconds=5
app.memory-limit-mb=1024
app.gc-interval-loops=10
